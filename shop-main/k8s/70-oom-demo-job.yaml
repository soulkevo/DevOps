apiVersion: batch/v1
kind: Job
metadata:
  name: oom-demo
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hog
          image: alpine:3.20
          resources:
            limits:
              memory: 64Mi
          command:
            - sh
            - -c
            - dd if=/dev/zero of=/dev/shm/fill bs=1M count=200
